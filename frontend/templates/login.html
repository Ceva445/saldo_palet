{% extends "base.html" %}

{% block title %}Logowanie — System palet{% endblock %}

{% block body %}
<div class="login-wrap">
    <div class="login-card">
        <h1>Logowanie — System palet</h1>
        <label>Użytkownik</label>
        <input id="username" autocomplete="username" />
        <label>Hasło</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="login-btn">Zaloguj</button>
        <div class="msg error" id="login-msg"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/login.js"></script>{% endblock %}
