{% extends "base.html" %}

{% block title %}Zmiana hasła — System palet{% endblock %}

{% block body %}
<div class="login-wrap">
    <div class="login-card">
        <h1>Zmiana hasła</h1>
        <p style="font-size:12px;color:#6b7280;margin:0 0 12px">Ustaw nowe hasło, aby kontynuować.</p>
        <label>Stare hasło</label>
        <input id="old-password" type="password" autocomplete="current-password" />
        <label>Nowe hasło</label>
        <input id="new-password" type="password" autocomplete="new-password" />
        <label>Powtórz nowe hasło</label>
        <input id="new-password2" type="password" autocomplete="new-password" />
        <button id="save-btn">Zapisz nowe hasło</button>
        <div class="msg error" id="cp-msg"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/change_password.js"></script>{% endblock %}
